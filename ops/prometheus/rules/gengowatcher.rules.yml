groups:
  - name: gengowatcher_recording
    interval: 30s
    rules:
      - record: gengowatcher:watcher_running
        expr: max(gengowatcher_watcher_running)

      - record: instance:node_cpu_utilization:ratio
        expr: |
          1 - avg by (instance) (
            rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])
          )

      - record: instance:node_memory_utilization:ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes{job="node-exporter"}
            /
            node_memory_MemTotal_bytes{job="node-exporter"}
          )

  - name: gengowatcher_alerts
    interval: 30s
    rules:
      - alert: GengoWatcherTargetDown
        expr: up{job="gengowatcher"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GengoWatcher metrics endpoint is down"
          description: "Prometheus cannot scrape the GengoWatcher /metrics endpoint on localhost:9091."

      - alert: GengoWatcherNotRunning
        expr: gengowatcher_watcher_running == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GengoWatcher watcher loop is not running"
          description: "The web API is up, but the underlying watcher reports is_running=0."

      - alert: GengoWatcherFailureCountHigh
        expr: gengowatcher_failure_count >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GengoWatcher failure count is elevated"
          description: "Watcher failure count has been {{ $value }} for at least 10 minutes."

      - alert: NodeExporterTargetDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "node_exporter is down"
          description: "Prometheus cannot scrape node_exporter on localhost:9100."

      - alert: HostCpuUsageHigh
        expr: instance:node_cpu_utilization:ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "CPU utilization has been above 85% for 10 minutes."

      - alert: HostMemoryUsageHigh
        expr: instance:node_memory_utilization:ratio > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is high"
          description: "Memory utilization has been above 90% for 10 minutes."
