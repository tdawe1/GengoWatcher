groups:
  - name: system_alerts
    interval: 30s
    rules:
      # ── Recording rules ─────────────────────────────────────────
      - record: instance:node_cpu_utilization:ratio
        expr: |
          1 - avg by (instance) (
            rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])
          )

      - record: instance:node_memory_utilization:ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes{job="node-exporter"}
            /
            node_memory_MemTotal_bytes{job="node-exporter"}
          )

      - record: instance:node_disk_utilization:ratio
        expr: |
          rate(node_disk_read_time_seconds_total{job="node-exporter"}[5m])
          +
          rate(node_disk_write_time_seconds_total{job="node-exporter"}[5m])

      # ── System alerts ──────────────────────────────────────────
      - alert: HostHighCpuLoad
        expr: instance:node_cpu_utilization:ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU utilization is {{ $value | humanizePercentage }} (threshold 85%)"

      - alert: HostHighMemoryLoad
        expr: instance:node_memory_utilization:ratio > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory utilization is {{ $value | humanizePercentage }} (threshold 90%)"

      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|fuse.*"}
          /
          node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|fuse.*"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

      - alert: HostDiskSpaceWarning
        expr: |
          (node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|fuse.*"}
          /
          node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|fuse.*"}) < 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk space getting low on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill{job="node-exporter"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OOM kill detected on {{ $labels.instance }}"
          description: "{{ $value }} OOM kills in the last 5 minutes"

  - name: service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}"

      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} missing"
          description: "No metrics received from {{ $labels.job }} for 5 minutes"

  - name: nginx_alerts
    interval: 30s
    rules:
      - alert: NginxHighErrorRate
        expr: |
          rate(nginx_server_requests{status=~"5.."}[5m])
          /
          rate(nginx_server_requests[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nginx high 5xx error rate"
          description: "5xx error rate is {{ $value | humanizePercentage }}"

  - name: docker_alerts
    interval: 30s
    rules:
      - alert: DockerContainerRestarting
        expr: increase(container_restart_count[10m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container_name }} keeps restarting"
          description: "Container restarted {{ $value }} times in the last 10 minutes"

  - name: synapse_alerts
    interval: 30s
    rules:
      - alert: SynapseHighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(synapse_http_server_response_time_seconds_bucket[5m])
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Synapse high p95 response time"
          description: "95th percentile response time is {{ $value }}s"

  - name: postgres_alerts
    interval: 30s
    rules:
      - alert: PostgresTooManyConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "{{ $value }} active connections"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL replication lag"
          description: "Replication lag is {{ $value }} seconds"
