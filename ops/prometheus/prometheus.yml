global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: gengowatcher
    scope: personal

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: gengowatcher
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9091
