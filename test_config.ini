[TestConfig]
# Test configuration for GengoWatcher integration tests

# Mock Server Settings
mock_host = 127.0.0.1
mock_port = 3000
mock_base_url = http://127.0.0.1:3000

# Test Scenarios
enabled_scenarios = normal_flow,cancellation_test,server_error
default_scenario = normal_flow

# Test Data
test_job_titles = English > Japanese Translation,French > German Document,Spanish > Italian Legal Text,German > English Contract,Chinese > Korean Business Document
test_job_rewards = 5.0,10.0,15.0,25.0,50.0,100.0

# Timing
job_creation_delay = 1.0
operation_timeout = 5.0
websocket_timeout = 10.0

# Validation
expected_cancellation_ratio = 2.0
min_test_jobs = 3
max_test_jobs = 10

# Logging
test_log_level = INFO
save_test_results = true
test_results_dir = test_results

# WebSocket
websocket_enabled = true
websocket_url = ws://127.0.0.1:3000/ws/jobs

# Performance
max_test_duration = 300
concurrent_operations = 3</content>
