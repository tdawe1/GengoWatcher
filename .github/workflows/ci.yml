name: CI

on:
  push:
    branches: [ windows-terminal-ui, main, master ]
  pull_request:
    branches: [ windows-terminal-ui, main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Code

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  format:
    runs-on: ubuntu-latest
    name: Check Code Formatting

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Check formatting with black
      run: |
        black --check .

  test:
    runs-on: ${{ matrix.os }}
    name: Run Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [lint, format]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        run: |
          export PYTHONPATH=.
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing tests/ src/tests/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing tests/ src/tests/

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  coverage:
    runs-on: ubuntu-latest
    name: Check Coverage Threshold
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate coverage report
        run: |
          export PYTHONPATH=.
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80 tests/ src/tests/

      - name: Check coverage for CAPTCHA modules specifically
        run: |
          export PYTHONPATH=.
          pytest --cov=src/gengowatcher/captcha_solver --cov=src/gengowatcher/captcha_manager --cov=src/gengowatcher/secure_storage --cov=src/gengowatcher/captcha_cli --cov-report=term-missing --cov-fail-under=85

  integration:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          export PYTHONPATH=.
          pytest -m integration -v
        continue-on-error: true