# High-Value Job Configuration for GengoWatcher
# This configuration is optimized for targeting high-value jobs

[Watcher]
# RSS feed should be your Gengo RSS feed, not The Guardian
feed_url = https://gengo.com/rss/available_jobs/6d9668ab271c486e52eb4d37b876cabd5a1cf2da958b7004205163
check_interval = 5
min_reward = 0.0
enable_notifications = true
enable_sound = true
use_custom_user_agent = false

[WebSocket]
enable_websocket = true
user_id = 789487
user_session = REPLACE_WITH_YOUR_SESSION_TOKEN
user_key = REPLACE_WITH_BROWSER_USER_KEY

[Paths]
sound_file = assets/high_value_alert.wav
log_file = logs/gengowatcher.log
notification_icon_path = assets/icon.ico
browser_path = /usr/bin/firefox
browser_args = --new-window {url}
all_entries_log = logs/all_entries.csv

[Logging]
log_max_bytes = 1000000
log_backup_count = 3
log_main_enabled = true
log_all_entries_enabled = true

[Network]
max_backoff = 60
user_agent_email = your_email@example.com

[AutoAccept]
enabled = false
min_reward = 0.0
max_reward = 999999.0
job_sources = websocket
accept_delay_min = 0
accept_delay_max = 0
browser_profile_path =
notification_on_accept = true
log_acceptance = true

[WebServer]
enabled = True
port = 8001
host = 127.0.0.1
auth_token = gengo-token-demo
cors_origins = http://localhost:5173

[RateLimit]
max_acceptances_per_hour = 50
max_acceptances_per_day = 200
min_delay_between_acceptances = 60
burst_limit = 5
burst_window = 300

[HighValue]
threshold = 500.0
very_high_threshold = 1000.0
extreme_threshold = 5000.0
immediate_response = true
min_processing_delay = 0.001
max_per_day = 999
min_interval_seconds = 1
desktop_notifications = true
notify_on_missed = true
extreme_value_no_daily_limit = true
extreme_value_no_interval = true

[Cancellation]
enabled = true
min_improvement_ratio = 2.0
extreme_threshold = 1000.0
auto_cancel_extreme_value = true

[Captcha]
enabled = true
service = 2captcha
api_key = YOUR_2CAPTCHA_API_KEY
max_retries = 5
retry_delay = 3
rate_limit = 120
rate_limit_window = 60
skip_on_v3_extraction_failure = false
recaptcha_v3_fallback_site_key = 6Lc6BAAAAAAAAAChqR2QwNcAAAAA
recaptcha_v3_default_action = job_acceptance
enable_browser_automation_fallback = true

[LocalCaptcha]
preferred_solver = tensorflow
tensorflow_model_path = models/captcha_model.h5
